server {
    listen 80;
    root /usr/share/nginx/html;

    # /es redirects to /es/ with a relative Location; nginx sits behind the HTTPS
    # proxy and would otherwise answer with an http:// address.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    # Unknown URLs answer with a real 404 status (the home page is still shown),
    # so search engines stop indexing every mistyped address as a copy of the home.
    error_page 404 /index.html;

    # File names are not versioned, so images and audio are cached for one day only:
    # a replaced file reaches returning visitors within 24 hours.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location /audio/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML, service worker, manifest, robots and sitemap: always revalidated,
    # so a new deploy is visible immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
